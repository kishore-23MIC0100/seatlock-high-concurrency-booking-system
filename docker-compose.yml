name: seatlock
services:
  postgres:
    image: postgres:16.15-alpine
    environment:
      POSTGRES_DB: seatlock
      POSTGRES_USER: seatlock
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seatlock -d seatlock"]
      interval: 3s
      timeout: 3s
      retries: 15
    volumes:
      - pg:/var/lib/postgresql/data
  redis:
    image: redis:7.4-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 10
  rabbitmq:
    image: rabbitmq:4.2-management-alpine
    hostname: seatlock-rabbit
    environment:
      RABBITMQ_DEFAULT_USER: seatlock
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Copy .env.example to .env}
    volumes:
      - rabbit:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 4s
      retries: 15
  api:
    build:
      context: ./services/api
    environment: &api-env
      SEATLOCK_BIND_ADDRESS: 0.0.0.0
      DATABASE_URL: jdbc:postgresql://postgres:5432/seatlock
      DATABASE_USER: seatlock
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_URL: redis://redis:6379
      SEATLOCK_REDIS_ENABLED: "true"
      AMQP_URL: amqp://seatlock:${RABBITMQ_PASSWORD}@rabbitmq:5672
      SEATLOCK_RABBIT_ENABLED: "true"
      SEATLOCK_SEED: ${SEATLOCK_SEED:-true}
      SEATLOCK_DEMO_STAFF: ${SEATLOCK_DEMO_STAFF:-true}
      SEATLOCK_DEMO_PAYMENTS: ${SEATLOCK_DEMO_PAYMENTS:-false}
      SEATLOCK_SECURE_COOKIE: ${SEATLOCK_SECURE_COOKIE:-false}
      SEATLOCK_API_DOCS: ${SEATLOCK_API_DOCS:-true}
      SEATLOCK_HOLD_SECONDS: ${SEATLOCK_HOLD_SECONDS:-600}
      SEATLOCK_ADMIN_EMAIL: ${SEATLOCK_ADMIN_EMAIL:-}
      SEATLOCK_ADMIN_PASSWORD: ${SEATLOCK_ADMIN_PASSWORD:-}
      RAZORPAY_TEST_ONLY: ${RAZORPAY_TEST_ONLY:-false}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      SEATLOCK_PROMETHEUS_OPEN: "true"
      SEATLOCK_WORKERS_ENABLED: ${SEATLOCK_INLINE_WORKERS:-true}
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 24
  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    ports:
      - "127.0.0.1:${SEATLOCK_WEB_PORT:-8180}:80"
    depends_on:
      api:
        condition: service_healthy
  worker:
    profiles: ["worker"]
    build:
      context: ./services/api
    environment:
      <<: *api-env
      DATABASE_POOL_SIZE: "6"
      SEATLOCK_SEED: "false"
      SEATLOCK_WORKERS_ENABLED: "true"
    depends_on:
      api:
        condition: service_healthy
  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v3.5.1
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9097:9090"
    depends_on:
      api:
        condition: service_healthy
  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:12.3.2
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./infra/monitoring/datasource.yml:/etc/grafana/provisioning/datasources/seatlock.yml:ro
      - ./infra/monitoring/dashboards.yml:/etc/grafana/provisioning/dashboards/seatlock.yml:ro
      - ./infra/monitoring/dashboard.json:/var/lib/grafana/dashboards/seatlock.json:ro
    ports:
      - "127.0.0.1:3017:3000"
    depends_on: [prometheus]

volumes:
  pg:
  rabbit:
